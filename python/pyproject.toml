[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hassh"
description = "HASSH - a profiling method for SSH clients and servers"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"
dynamic = ["version"]
keywords = ["ssh", "fingerprint", "hassh", "network", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
hassh = "hassh.cli:main"

[tool.hatch.version]
path = "hassh/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["hassh"]

[tool.hatch.build.targets.wheel.force-include]
"hasshGen/hassh_fingerprints.json" = "hassh/data/hassh_fingerprints.json"
"hasshGen/hasshserver_fingerprints.json" = "hassh/data/hasshserver_fingerprints.json"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Run inside images with very old interpreters.
"hasshGen/paramiko_*.py" = ["UP"]
